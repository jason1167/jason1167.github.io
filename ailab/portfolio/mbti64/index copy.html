<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 64型全維度人格進階評測系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --secondary: #10b981;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 20px; line-height: 1.6; }
        #app { max-width: 900px; width: 100%; background: var(--card); padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        /* 開始頁面 */
        .intro-header { text-align: center; margin-bottom: 2rem; }
        .gender-selector { display: flex; justify-content: center; gap: 30px; margin: 25px 0; padding: 15px; background: var(--primary-light); border-radius: 12px; }
        .gender-selector label { cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        /* 測驗過程 */
        .progress-container { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; margin-bottom: 2.5rem; }
        #progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: width 0.3s ease; border-radius: 5px; }
        .question-box { min-height: 180px; text-align: center; }
        .question-text { font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem; color: #1e293b; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .opt-btn { padding: 16px; border: 2px solid var(--border); border-radius: 12px; background: white; cursor: pointer; transition: all 0.2s; font-size: 1.1rem; font-weight: 500; }
        .opt-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-2px); }

        /* 結果報告細節 */
        .result-header { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 2rem; margin-bottom: 2rem; }
        .type-badge { background: var(--accent); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; display: inline-block; }
        .type-code { font-size: 4.5rem; font-weight: 900; color: var(--primary); letter-spacing: 4px; margin: 10px 0; line-height: 1; }
        .chart-box { height: 400px; margin: 2rem 0; }
        
        .report-section { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 2rem; }
        .info-card { background: #fdfdfd; padding: 25px; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .info-card h4 { color: var(--primary); margin-top: 0; border-left: 4px solid var(--primary); padding-left: 10px; font-size: 1.2rem; }
        
        .detailed-list { padding-left: 1.2rem; margin: 0; }
        .detailed-list li { margin-bottom: 10px; }

        .action-btns { margin-top: 40px; display: flex; gap: 15px; }
        .btn { flex: 1; padding: 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: opacity 0.2s; }
        .btn-print { background: #64748b; color: white; }
        .btn-retry { background: var(--primary); color: white; }

        @media (max-width: 768px) { .report-section { grid-template-columns: 1fr; } .type-code { font-size: 3.5rem; } }
        @media print { .action-btns, .progress-container, #intro { display: none !important; } body { padding: 0; background: white; } #app { box-shadow: none; border: none; width: 100%; max-width: 100%; } }
    </style>
</head>
<body>

<div id="app">
    <div id="intro">
        <div class="intro-header">
            <h1>64型全維度人格分析</h1>
            <p>本系統將分析您的能量來源、感知路徑、決策邏輯、生活態度、壓力韌性及認知模型。</p>
        </div>
        
        <div class="gender-selector">
            <label><input type="radio" name="gender" value="male" checked> 👨 男性常模</label>
            <label><input type="radio" name="gender" value="female"> 👩 女性常模</label>
        </div>

        <button class="btn btn-retry" onclick="startQuiz()">開始深度評測</button>
        <div id="history-tip" style="text-align:center; margin-top:20px; color:#94a3b8; font-size:0.9rem;"></div>
    </div>

    <div id="quiz" class="hidden">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div class="question-box">
            <p id="q-text" class="question-text"></p>
            <div class="options-grid">
                <button class="opt-btn" onclick="handleAns(3)">非常符合</button>
                <button class="opt-btn" onclick="handleAns(1)">符合</button>
                <button class="opt-btn" onclick="handleAns(0)">普通 / 不確定</button>
                <button class="opt-btn" onclick="handleAns(-1)">不符合</button>
                <button class="opt-btn" onclick="handleAns(-3)">非常不符合</button>
            </div>
        </div>
    </div>

    <div id="result" class="hidden">
        <div class="result-header">
            <div id="rarity-tag" class="type-badge hidden">稀有人格組合</div>
            <div id="res-code" class="type-code"></div>
            <h2 id="res-title" style="color:#475569"></h2>
        </div>

        <div class="chart-box"><canvas id="radarChart"></canvas></div>

        <div class="report-section">
            <div class="info-card">
                <h4>🎯 核心特質優勢</h4>
                <ul id="res-adv" class="detailed-list"></ul>
            </div>
            <div class="info-card">
                <h4>💼 職涯與環境建議</h4>
                <p id="res-work"></p>
            </div>
            <div class="info-card">
                <h4>🌱 壓力應對與成長</h4>
                <p id="res-stress"></p>
            </div>
            <div class="info-card">
                <h4>💡 給您的發展指南</h4>
                <ul id="res-tips" class="detailed-list"></ul>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn btn-print" onclick="window.print()">匯出詳細報告 (PDF)</button>
            <button class="btn btn-retry" onclick="restart()">重新測驗</button>
        </div>
    </div>
</div>

<script>
    // ------------------ 60 題庫資料 ------------------
    const questions = [
        { t: "在社交聚會後，你通常感到充滿活力而非疲憊。", d: "E", v: 1 },
        { t: "你傾向於在說話的過程中思考，而不是想好了再說。", d: "E", v: 1 },
        { t: "你喜歡成為眾人注意的焦點。", d: "E", v: 1 },
        { t: "在人群中待太久會讓你覺得精疲力竭。", d: "E", v: -1 },
        { t: "你主動與陌生人交談並介紹自己。", d: "E", v: 1 },
        { t: "你更喜歡深度的一對一對談，勝過大型群體聊天。", d: "E", v: -1 },
        { t: "你覺得獨處一整天是很放鬆且充實的。", d: "E", v: -1 },
        { t: "你在團隊合作中比獨自工作時更有動力。", d: "E", v: 1 },
        { t: "你很容易融入新的社交圈。", d: "E", v: 1 },
        { t: "你在電話交談中比面對面交談更容易感到疲倦。", d: "E", v: -1 },
        { t: "你更關注當下的現實，而不是未來的可能性。", d: "S", v: 1 },
        { t: "你常被抽象的概念或哲學問題吸引。", d: "S", v: -1 },
        { t: "你喜歡按部就班的操作手冊，而不是靠直覺。", d: "S", v: 1 },
        { t: "你常會天馬行空地幻想，甚至忽略周遭環境。", d: "S", v: -1 },
        { t: "你更喜歡實用的技能，勝過理論知識。", d: "S", v: 1 },
        { t: "你是一個現實主義者，而不是一個夢想家。", d: "S", v: 1 },
        { t: "你擅長觀察周遭環境的細微變化。", d: "S", v: 1 },
        { t: "你經常思考人類存在的意義與未來的演變。", d: "S", v: -1 },
        { t: "你傾向於相信自己的經驗，而不是直覺。", d: "S", v: 1 },
        { t: "你容易對重複、枯燥的常規工作感到厭煩。", d: "S", v: -1 },
        { t: "在做決定時，邏輯通常比情感更重要。", d: "T", v: 1 },
        { t: "你很難共情那些情緒化的人。", d: "T", v: 1 },
        { t: "你寧願實話實說而傷害別人，也不願說謊安撫。", d: "T", v: 1 },
        { t: "你經常會為了維持群體和諧而做出讓步。", d: "T", v: -1 },
        { t: "你傾向於客觀地分析問題，不帶個人偏見。", d: "T", v: 1 },
        { t: "當朋友遇到困難，你第一時間提供情感支持而非建議。", d: "T", v: -1 },
        { t: "你認為效率比合作中的愉悅感更重要。", d: "T", v: 1 },
        { t: "你容易被電影或書中的情感橋段感動。", d: "T", v: -1 },
        { t: "在爭論中，真理比贏得對方的認同更重要。", d: "T", v: 1 },
        { t: "當你需要辭退某人時，你會感到極大的心理負擔。", d: "T", v: -1 },
        { t: "出發旅行前，你會制定詳細的行程表。", d: "J", v: 1 },
        { t: "你更喜歡隨遇而安，而不是預先計畫。", d: "J", v: -1 },
        { t: "你的桌面和房間通常保持得很整潔。", d: "J", v: 1 },
        { t: "你習慣在最後一刻才完成任務（Deadline 驅動）。", d: "J", v: -1 },
        { t: "你喜歡把事情定下來，而不是保持靈活性。", d: "J", v: 1 },
        { t: "你覺得嚴格的時間表會讓你感到窒息。", d: "J", v: -1 },
        { t: "完成清單上的待辦事項會讓你感到成就感。", d: "J", v: 1 },
        { t: "你適應環境變化的能力很強。", d: "J", v: -1 },
        { t: "你不喜歡突如其來的改變或驚喜。", d: "J", v: 1 },
        { t: "在開始新項目之前，你會先設定明確的目標。", d: "J", v: 1 },
        { t: "你很少對自己的決定感到後悔。", d: "A", v: 1 },
        { t: "你經常擔心事情會出錯，即使一切看起來很好。", d: "A", v: -1 },
        { t: "面對壓力時，你能保持冷靜且情緒穩定。", d: "A", v: 1 },
        { t: "你非常在意他人對你的評價或看法。", d: "A", v: -1 },
        { t: "你覺得自己很有自信，且不容易被挫折打擊。", d: "A", v: 1 },
        { t: "你經常情緒波動，容易感到焦慮或憂鬱。", d: "A", v: -1 },
        { t: "你對過去犯下的錯誤耿耿於懷。", d: "A", v: -1 },
        { t: "在社交場合中，你很少感到尷尬或不自在。", d: "A", v: 1 },
        { t: "你是一個完美主義者，這讓你壓力很大。", d: "A", v: -1 },
        { t: "你相信自己有能力處理生活中的突發狀況。", d: "A", v: 1 },
        { t: "你著迷於機械、程式或自然界的運作規律。", d: "Y", v: 1 },
        { t: "你能精準察覺到別人的微表情或情緒變化。", d: "Y", v: -1 },
        { t: "你喜歡整理資料、分類物品或分析數據。", d: "Y", v: 1 },
        { t: "當別人哭泣時，你會有強烈的生理衝動想安慰對方。", d: "Y", v: -1 },
        { t: "你傾向於用「如果...那麼...」的邏輯來思考人生。", d: "Y", v: 1 },
        { t: "你認為維繫人與人之間的溫度比達成目標更重要。", d: "Y", v: -1 },
        { t: "你喜歡閱讀科學原理、法律條文或邏輯推導。", d: "Y", v: 1 },
        { t: "你經常自發地站在別人的立場思考問題。", d: "Y", v: -1 },
        { t: "看到不符合邏輯的流程會讓你感到抓狂。", d: "Y", v: 1 },
        { t: "你認為世界是由情感與故事組成的，而非數據。", d: "Y", v: -1 }
    ];

    // ------------------ 邏輯運作 ------------------
    let cur = 0;
    let scores = { E: 0, S: 0, T: 0, J: 0, A: 0, Y: 0 };
    let gender = 'male';

    window.onload = () => {
        const saved = localStorage.getItem('mbti_pro_res');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('history-tip').innerText = `檢測到您於 ${data.date} 的分析，已自動載入。`;
            scores = data.scores;
            gender = data.gender;
            showResult(false);
        }
    };

    function startQuiz() {
        gender = document.querySelector('input[name="gender"]:checked').value;
        document.getElementById('intro').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        renderQ();
    }

    function renderQ() {
        document.getElementById('q-text').innerText = `${cur + 1}. ${questions[cur].t}`;
        document.getElementById('progress-bar').style.width = `${(cur / questions.length) * 100}%`;
    }

    function handleAns(val) {
        scores[questions[cur].d] += (val * questions[cur].v);
        cur++;
        if (cur < questions.length) renderQ(); else showResult(true);
    }

    function showResult(save = true) {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('intro').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');

        const code = (scores.E>=0?'E':'I')+(scores.S>=0?'S':'N')+(scores.T>=0?'T':'F')+(scores.J>=0?'J':'P')+'-'+(scores.A>=0?'A':'T')+(scores.Y>=0?'Y':'Z');
        document.getElementById('res-code').innerText = code;

        // 1. 稀有度判定
        if ((gender==='female' && scores.T>=0) || (gender==='male' && scores.T<0)) {
            document.getElementById('rarity-tag').classList.remove('hidden');
        }

        // 2. 詳細報告字典
        const dict = {
            E: "社交能量者：擅長獲取外部資源。", I: "深度內省者：具備極強專注力。",
            S: "務實派：重視數據與經驗細節。", N: "願景派：擅長預測趨勢與抽象思考。",
            T: "邏輯導向：決策客觀、效率優先。", F: "價值導向：重視和諧與人文影響。",
            A: "自信穩定：抗壓性強，不易自我懷疑。", T: "細膩完美：警覺性高，追求極致品質。",
            Y: "系統邏輯：看世界為一套運行的數據。", Z: "共情理解：看世界為情感的連結網。"
        };

        // 3. 填充內容
        document.getElementById('res-title').innerText = `${dict[code[0]]} | ${dict[code[5]]}`;
        
        const advList = document.getElementById('res-adv');
        advList.innerHTML = `<li><strong>${dict[code[0]]}</strong>：這使您在能量分配上極具優勢。</li>
                            <li><strong>${dict[code[2]]} x ${dict[code[6]]}</strong>：創造了您獨特的決策模式。</li>
                            <li><strong>高${code.includes('A')?'穩定':'警覺'}度</strong>：在複雜環境中能保持${code.includes('A')?'穩健':'細緻'}。</li>`;

        document.getElementById('res-work').innerText = code.includes('Y') 
            ? "您適合結構化、邏輯密集的環境。例如：架構師、科學分析、精密工程或策略顧問。您在處理『系統性問題』時最具效率。"
            : "您適合以人為核心的環境。例如：藝術指導、心理諮商、品牌敘事或社會企業。您的直覺與同理心是團隊的黏合劑。";

        document.getElementById('res-stress').innerText = code.includes('-A')
            ? "壓力下您傾向保持冷靜，甚至可能忽略細微的風險預警。建議偶爾聽取他人的謹慎建議。"
            : "您容易受壓力影響，但也因此能比他人更早發現潛在危機。建議練習正念或將任務切細以降低焦慮感。";

        const tips = document.getElementById('res-tips');
        tips.innerHTML = `<li>${code.includes('I')?'嘗試主動表達觀點，別讓深刻的思想只留在腦中。':'學習獨處的藝術，從內部尋求肯定而非外部社交。'}</li>
                          <li>${code.includes('Y')?'在推動邏輯時，記得考慮人的情感摩擦力。':'在體貼他人時，不要忘了堅持原則性的數據事實。'}</li>`;

        if (save) {
            localStorage.setItem('mbti_pro_res', JSON.stringify({
                scores, gender, date: new Date().toLocaleDateString()
            }));
        }
        drawChart();
    }

    function drawChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        const norm = (v) => ((v + 30) / 60) * 100;
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['能量(E/I)', '資訊(S/N)', '邏輯(T/F)', '生活(J/P)', '穩定(A/T)', '系統(Y/Z)'],
                datasets: [{
                    label: '人格維度分佈',
                    data: [norm(scores.E), norm(scores.S), norm(scores.T), norm(scores.J), norm(scores.A), norm(scores.Y)],
                    backgroundColor: 'rgba(79, 70, 229, 0.2)',
                    borderColor: '#4f46e5',
                    pointBackgroundColor: '#4f46e5',
                    borderWidth: 3
                }]
            },
            options: {
                scales: { r: { min: 0, max: 100, ticks: { display: false } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    function restart() {
        localStorage.removeItem('mbti_pro_res');
        location.reload();
    }
</script>
</body>
</html>
