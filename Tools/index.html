<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jason 工具箱 | 開發者工具庫</title>
  <meta name="description" content="精選高效率線上實用工具庫，提供開發者輔助、編碼轉換、文字處理與安全工具。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    /* ==========================================================================
       UIUX Style 規範定義：
       1. 色彩系統：米色(#F5F5DC)、藍色(#006699)、灰色
       2. 風格：MUJI 簡約 + Microsoft Fluent + Claude + Linear + Cursor 融合
       3. Typography：微軟正黑體, Inter, Noto Sans TC
          限定 7 種尺寸：32px, 24px, 20px, 18px, 16px, 14px, 12px
       4. Icon 尺寸：16px, 20px, 24px (Lucide 風格)
       ========================================================================== */

    :root {
      /* 色彩系統規範：米色、藍色(#006699)、灰色 */
      --color-beige-base: #F5F5DC;
      --color-beige-subtle: #fcfbfa;
      --color-beige-light: #f7f6f0;
      --color-beige-border: #e8e6dc;

      --primary: #006699;
      --primary-hover: #00527c;
      --primary-light: #e6f0f5;
      --primary-glow: rgba(0, 102, 153, 0.12);

      --gray-900: #1f2937;
      /* 主要文字 */
      --gray-700: #374151;
      /* 次要文字 */
      --gray-500: #6b7280;
      /* 輔助與靜音文字 */
      --gray-300: #d1d5db;
      /* 淺灰邊框 */
      --gray-200: #e5e7eb;
      /* 淺灰分隔線 */
      --gray-100: #f3f4f6;
      /* 淺灰底色 */
      --gray-50: #f9fafb;

      --bg-body: var(--color-beige-subtle);
      --bg-surface: #ffffff;
      --border-color: var(--color-beige-border);
      --border-hover: #006699;

      /* 輔助狀態色調 */
      --badge-green-bg: #ecfdf5;
      --badge-green-text: #059669;
      --badge-amber-bg: #fffbeb;
      --badge-amber-text: #d97706;
      --badge-blue-bg: var(--primary-light);
      --badge-blue-text: var(--primary);

      /* 圓角與陰影 (Fluent / Linear 簡約質感) */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card-hover: 0 10px 20px -3px rgba(0, 102, 153, 0.08), 0 3px 6px -1px rgba(0, 0, 0, 0.03);
      --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      background-color: var(--bg-body);
      color: var(--gray-900);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 16px;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(245, 245, 220, 0.6) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 102, 153, 0.03) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* 頂部導航列 */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 2rem;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--gray-900);
      font-weight: 700;
      font-size: 20px;
      /* 規範尺寸: 20 */
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px var(--primary-glow);
    }

    .brand-icon svg {
      width: 20px;
      /* 規範 Icon 尺寸: 20 */
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge-counter {
      font-size: 14px;
      /* 規範尺寸: 14 */
      padding: 0.25rem 0.75rem;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      color: var(--gray-700);
    }

    .badge-counter span {
      color: var(--primary);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    /* 英雄區塊 (Hero Section) */
    .hero {
      text-align: center;
      max-width: 820px;
      margin: 3rem auto 2rem auto;
      padding: 0 1.5rem;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      color: var(--gray-700);
      font-size: 14px;
      /* 規範尺寸: 14 */
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .hero-pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .hero h1 {
      font-size: 32px;
      /* 規範尺寸: 32 */
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: var(--gray-900);
    }

    .hero p {
      color: var(--gray-500);
      font-size: 16px;
      /* 規範尺寸: 16 */
      max-width: 600px;
      margin: 0 auto 1.75rem auto;
      line-height: 1.6;
    }

    /* 搜尋與篩選區域 */
    .controls-container {
      max-width: 1040px;
      margin: 0 auto 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      /* 規範 Icon 尺寸: 20 */
      height: 20px;
      stroke: var(--gray-500);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--gray-900);
      font-size: 14px;
      /* 規範尺寸: 14 */
      outline: none;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .search-input::placeholder {
      color: var(--gray-500);
    }

    /* 分類標籤頁籤 */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--gray-700);
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      font-size: 14px;
      /* 規範尺寸: 14 */
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
      box-shadow: var(--shadow-sm);
    }

    .tab-btn:hover {
      background: var(--color-beige-light);
      color: var(--gray-900);
      border-color: var(--gray-300);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    /* 工具卡片網格 (Gallery Grid) - 項目縮小至 75% 緊湊配置 */
    .gallery-container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem 1.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.95rem;
    }

    /* 工具卡片樣式 (75% 緊湊比例) */
    .tool-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.125rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      transition: var(--transition);
      position: relative;
      cursor: pointer;
    }

    .tool-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow-card-hover);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .tool-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      color: var(--primary);
      transition: var(--transition);
    }

    .tool-card:hover .tool-icon {
      background: var(--primary-light);
      border-color: rgba(0, 102, 153, 0.2);
    }

    .tool-icon svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .status-ready {
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
      border: 1px solid rgba(5, 150, 105, 0.15);
    }

    .status-popular {
      background: var(--badge-amber-bg);
      color: var(--badge-amber-text);
      border: 1px solid rgba(217, 119, 6, 0.15);
    }

    .status-new {
      background: var(--badge-blue-bg);
      color: var(--badge-blue-text);
      border: 1px solid rgba(0, 102, 153, 0.15);
    }

    .card-body {
      flex: 1;
      margin-bottom: 0.95rem;
    }

    .tool-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--gray-900);
    }

    .tool-desc {
      color: var(--gray-500);
      font-size: 12px;
      line-height: 1.45;
    }

    .card-footer {
      display: flex;
      align-items: flex-start;
      border-top: 1px solid var(--gray-100);
      padding-top: 0.65rem;
    }

    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 0.25rem;
      min-height: 44px;
      /* 預留 2 行標籤排版空間，保持全站卡片整齊一致 */
      width: 100%;
    }

    .tag-item {
      font-size: 11px;
      line-height: 1.35;
      padding: 0.1rem 0.35rem;
      background: var(--color-beige-light);
      color: var(--gray-700);
      border-radius: 3px;
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      height: 20px;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.3rem;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      white-space: nowrap;
    }

    .tool-card:hover .action-link {
      color: var(--primary-hover);
      transform: translateX(2px);
    }

    .action-link svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    /* 空狀態 (Empty State) */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      grid-column: 1 / -1;
      display: none;
    }

    .empty-icon {
      width: 24px;
      /* 規範 Icon 尺寸: 24 */
      height: 24px;
      margin: 0 auto 0.75rem auto;
      color: var(--gray-500);
    }

    .empty-title {
      font-size: 18px;
      /* 規範尺寸: 18 */
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 0.25rem;
    }

    .empty-desc {
      font-size: 14px;
      /* 規範尺寸: 14 */
      color: var(--gray-500);
    }

    /* 互動操作彈窗 (Tool Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 41, 55, 0.4);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      box-shadow: var(--shadow-modal);
      transform: scale(0.97);
      transition: transform 0.2s ease, max-width 0.2s ease;
    }

    .modal-box.modal-wide {
      max-width: 880px;
    }

    .modal-box.modal-extra-wide {
      max-width: 1100px;
    }

    /* 文字比對工具專屬樣式 (Text Diff Comparer) */
    .diff-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .diff-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.9rem;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }

    .diff-toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .diff-mode-toggle {
      display: inline-flex;
      background: var(--bg-surface);
      padding: 2px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    .diff-mode-btn {
      padding: 0.25rem 0.65rem;
      font-size: 12px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--gray-600);
      cursor: pointer;
      border-radius: 4px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .diff-mode-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 1px 3px var(--primary-glow);
    }

    .diff-option-check {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 12px;
      color: var(--gray-700);
      cursor: pointer;
      user-select: none;
    }

    .diff-option-check input {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .diff-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 768px) {
      .diff-inputs-grid {
        grid-template-columns: 1fr;
      }
    }

    .diff-input-card {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .diff-input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-700);
    }

    .diff-input-stats {
      font-size: 11px;
      color: var(--gray-500);
      font-family: 'JetBrains Mono', monospace;
    }

    .diff-textarea {
      height: 140px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
      tab-size: 2;
    }

    /* 差異統計列 */
    .diff-summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 12px;
      padding: 0.4rem 0.75rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }

    .diff-stat-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .diff-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }

    .diff-badge-add {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }

    .diff-badge-del {
      background: rgba(239, 68, 68, 0.12);
      color: #dc2626;
    }

    .diff-badge-equal {
      background: var(--gray-100);
      color: var(--gray-600);
    }

    /* 比對檢視區 */
    .diff-viewer-wrapper {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: #ffffff;
      max-height: 380px;
      overflow: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    /* 並排模式表格 */
    .diff-split-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .diff-split-table td {
      padding: 2px 6px;
      vertical-align: top;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .diff-split-table th {
      background: var(--color-beige-light);
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 11px;
      color: var(--gray-600);
      text-align: left;
      padding: 2px 8px;
      line-height: 1.25;
      vertical-align: middle;
    }

    .diff-split-pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 1.25;
    }

    .diff-line-num {
      width: 44px;
      min-width: 44px;
      max-width: 44px;
      box-sizing: border-box;
      text-align: left;
      padding: 2px 4px 2px 8px !important;
      color: var(--gray-400);
      user-select: none;
      border-right: 1px solid var(--border-color);
      background: #fafafa;
      font-size: 11px;
    }

    .diff-line-content {
      padding: 2px 8px !important;
    }

    .diff-left-content {
      border-right: 1px solid var(--border-color);
    }

    /* 行內模式表格 */
    .diff-inline-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .diff-inline-table td {
      padding: 2px 6px;
      vertical-align: top;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .diff-inline-num {
      width: 42px;
      min-width: 42px;
      max-width: 42px;
      box-sizing: border-box;
      text-align: left;
      padding: 2px 4px 2px 8px !important;
      color: var(--gray-400);
      user-select: none;
      background: #fafafa;
      border-right: 1px solid var(--border-color);
      font-size: 11px;
    }

    .diff-inline-sign {
      width: 24px;
      min-width: 24px;
      max-width: 24px;
      box-sizing: border-box;
      text-align: center;
      font-weight: 700;
      user-select: none;
    }

    /* 差異背景與文字加亮 */
    .diff-row-del {
      background-color: rgba(239, 68, 68, 0.08);
    }

    .diff-row-del .diff-line-num,
    .diff-row-del .diff-inline-num {
      background-color: rgba(239, 68, 68, 0.14);
      color: #dc2626;
    }

    .diff-row-del .diff-inline-sign {
      color: #dc2626;
    }

    .diff-row-add {
      background-color: rgba(16, 185, 129, 0.08);
    }

    .diff-row-add .diff-line-num,
    .diff-row-add .diff-inline-num {
      background-color: rgba(16, 185, 129, 0.14);
      color: #059669;
    }

    .diff-row-add .diff-inline-sign {
      color: #059669;
    }

    .diff-row-empty {
      background-color: #fbfbfa;

    function openToolModal(toolId) {
      const tool = TOOLS.find(t => t.id === toolId);
      if (!tool) return;

      modalTitle.textContent = tool.title;
      modalCategoryBadge.textContent = tool.categoryName;
      modalIcon.innerHTML = `
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          ${tool.iconSvg}
        </svg>
      `;

      if (tool.extraWideModal) {
        modalBox.classList.add('modal-extra-wide');
      } else if (tool.wideModal) {
        modalBox.classList.add('modal-wide');
      } else {
        modalBox.classList.remove('modal-wide', 'modal-extra-wide');
      }

      modalContent.innerHTML = '';
      if (typeof tool.initModal === 'function') {
        tool.initModal(modalContent);
      }

      toolModal.classList.add('active');
      toolModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    // 關閉 Modal 彈窗
    function closeModal() {
      toolModal.classList.remove('active');
      toolModal.setAttribute('aria-hidden', 'true');
      modalBox.classList.remove('modal-wide', 'modal-extra-wide');
      document.body.style.overflow = '';
    }

    // 事件監聽綁定
    modalCloseBtn.addEventListener('click', closeModal);
    toolModal.addEventListener('click', (e) => {
      if (e.target === toolModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && toolModal.classList.contains('active')) {
        closeModal();
      }
    });

    // 分類標籤點擊切換
    categoryTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      categoryTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.getAttribute('data-category');
      renderGallery();
    });

    // 搜尋輸入即時過濾
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGallery();
    });

    // 初始化頁面
    renderGallery();
  </script>
</body>

</html>
