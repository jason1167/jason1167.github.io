<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jason 應用中心 | 獨立 Web 應用與 PWA</title>
  <meta name="description" content="精選獨立 Web 應用與 Progressive Web Apps (PWA)，提供本機優先、離線可用與高隱私的實用數位工具。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    /* ==========================================================================
       UIUX Style 規範定義：
       1. 色彩系統：米色(#F5F5DC)、藍色(#006699)、灰色
       2. 風格：MUJI 簡約 + Microsoft Fluent + Claude + Linear 融合質感
       3. Typography：微軟正黑體, Inter, Noto Sans TC
          限定 7 種尺寸：32px, 24px, 20px, 18px, 16px, 14px, 12px
       4. Icon 尺寸：16px, 20px, 24px (Lucide 風格)
       ========================================================================== */

    :root {
      /* 色彩系統規範：米色、藍色(#006699)、灰色 */
      --color-beige-base: #F5F5DC;
      --color-beige-subtle: #fcfbfa;
      --color-beige-light: #f7f6f0;
      --color-beige-border: #e8e6dc;

      --primary: #006699;
      --primary-hover: #00527c;
      --primary-light: #e6f0f5;
      --primary-glow: rgba(0, 102, 153, 0.12);

      --gray-900: #1f2937;
      /* 主要文字 */
      --gray-700: #374151;
      /* 次要文字 */
      --gray-500: #6b7280;
      /* 輔助與靜音文字 */
      --gray-300: #d1d5db;
      /* 淺灰邊框 */
      --gray-200: #e5e7eb;
      /* 淺灰分隔線 */
      --gray-100: #f3f4f6;
      /* 淺灰底色 */
      --gray-50: #f9fafb;

      --bg-body: var(--color-beige-subtle);
      --bg-surface: #ffffff;
      --border-color: var(--color-beige-border);
      --border-hover: #006699;

      /* 輔助狀態色調 */
      --badge-green-bg: #ecfdf5;
      --badge-green-text: #059669;
      --badge-amber-bg: #fffbeb;
      --badge-amber-text: #d97706;
      --badge-blue-bg: var(--primary-light);
      --badge-blue-text: var(--primary);
      --badge-purple-bg: #f5f3ff;
      --badge-purple-text: #7c3aed;

      /* 圓角與陰影 (Fluent / Linear 簡約質感) */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card-hover: 0 10px 20px -3px rgba(0, 102, 153, 0.08), 0 3px 6px -1px rgba(0, 0, 0, 0.03);
      --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      background-color: var(--bg-body);
      color: var(--gray-900);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 16px;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(245, 245, 220, 0.6) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 102, 153, 0.03) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* 頂部導航列 */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 2rem;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--gray-900);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px var(--primary-glow);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-700);
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      text-decoration: none;
      transition: var(--transition);
    }

    .nav-link:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: rgba(0, 102, 153, 0.3);
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
    }

    .badge-counter {
      font-size: 14px;
      padding: 0.25rem 0.75rem;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      color: var(--gray-700);
    }

    .badge-counter span {
      color: var(--primary);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    /* 英雄區塊 (Hero Section) */
    .hero {
      text-align: center;
      max-width: 820px;
      margin: 3rem auto 2rem auto;
      padding: 0 1.5rem;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      color: var(--gray-700);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .hero-pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: var(--gray-900);
    }

    .hero p {
      color: var(--gray-500);
      font-size: 16px;
      max-width: 620px;
      margin: 0 auto 1.75rem auto;
      line-height: 1.6;
    }

    /* 搜尋與篩選區域 */
    .controls-container {
      max-width: 1040px;
      margin: 0 auto 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      stroke: var(--gray-500);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--gray-900);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .search-input::placeholder {
      color: var(--gray-500);
    }

    /* 分類標籤頁籤 */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--gray-700);
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
      box-shadow: var(--shadow-sm);
    }

    .tab-btn:hover {
      background: var(--color-beige-light);
      color: var(--gray-900);
      border-color: var(--gray-300);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    /* 應用卡片網格 (Gallery Grid) */
    .gallery-container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem 1.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.15rem;
    }

    /* 卡片樣式 */
    .app-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      transition: var(--transition);
      position: relative;
      cursor: pointer;
    }

    .app-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow-card-hover);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .app-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      color: var(--primary);
      transition: var(--transition);
    }

    .app-card:hover .app-icon {
      background: var(--primary-light);
      border-color: rgba(0, 102, 153, 0.2);
    }

    .app-icon svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .status-ready {
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
      border: 1px solid rgba(5, 150, 105, 0.15);
    }

    .status-popular {
      background: var(--badge-amber-bg);
      color: var(--badge-amber-text);
      border: 1px solid rgba(217, 119, 6, 0.15);
    }

    .status-new {
      background: var(--badge-blue-bg);
      color: var(--badge-blue-text);
      border: 1px solid rgba(0, 102, 153, 0.15);
    }

    .status-planned {
      background: var(--badge-purple-bg);
      color: var(--badge-purple-text);
      border: 1px solid rgba(124, 58, 237, 0.15);
    }

    .card-body {
      flex: 1;
      margin-bottom: 1rem;
    }

    .app-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 0.45rem;
      color: var(--gray-900);
    }

    .app-desc {
      color: var(--gray-500);
      font-size: 13px;
      line-height: 1.55;
    }

    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid var(--gray-100);
      padding-top: 0.75rem;
    }

    .app-tags {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 0.3rem;
      min-height: 24px;
      width: 100%;
    }

    .tag-item {
      font-size: 11px;
      line-height: 1.35;
      padding: 0.1rem 0.4rem;
      background: var(--color-beige-light);
      color: var(--gray-700);
      border-radius: 3px;
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      height: 22px;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
    }

    .card-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .app-card:hover .action-link {
      color: var(--primary-hover);
      transform: translateX(2px);
    }

    .action-link svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.2;
    }

    /* 空狀態 (Empty State) */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      grid-column: 1 / -1;
      display: none;
    }

    .empty-icon {
      width: 24px;
      height: 24px;
      margin: 0 auto 0.75rem auto;
      color: var(--gray-500);
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 0.25rem;
    }

    .empty-desc {
      font-size: 14px;
      color: var(--gray-500);
    }

    /* 互動操作彈窗 (App Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 41, 55, 0.4);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      box-shadow: var(--shadow-modal);
      transform: scale(0.97);
      transition: transform 0.2s ease, max-width 0.2s ease;
    }

    .modal-box.modal-wide {
      max-width: 960px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-beige-border);
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .modal-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 0.2rem;
    }

    .modal-close-btn {
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      color: var(--gray-700);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-close-btn:hover {
      background: var(--gray-200);
      color: var(--gray-900);
    }

    .modal-content-area {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .feature-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
      margin: 0.5rem 0;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.75rem;
      background: var(--color-beige-light);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }

    .feature-item svg {
      width: 18px;
      height: 18px;
      stroke: var(--primary);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .feature-text strong {
      display: block;
      font-size: 14px;
      color: var(--gray-900);
      margin-bottom: 0.2rem;
    }

    .feature-text p {
      font-size: 12px;
      color: var(--gray-500);
      line-height: 1.45;
    }

    .preview-frame-container {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      height: 520px;
      background: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .preview-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .btn {
      padding: 0.55rem 1.15rem;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--gray-700);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--color-beige-light);
      color: var(--gray-900);
      border-color: var(--gray-300);
    }

    /* 頁尾 */
    .footer {
      text-align: center;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 12px;
      color: var(--gray-500);
    }

    /* 響應式微調 */
    @media (max-width: 768px) {
      .navbar {
        padding: 0.8rem 1.25rem;
      }

      .hero h1 {
        font-size: 24px;
      }

      .hero {
        margin: 2rem auto 1.5rem auto;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .modal-box {
        padding: 1.25rem;
      }

      .preview-frame-container {
        height: 420px;
      }
    }
  </style>
</head>

<body>

  <!-- 頂部導航 -->
  <header class="navbar">
    <a href="../index.html" class="brand">
      <div class="brand-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
      </div>
      <span>Jason's Apps</span>
    </a>
    <div class="nav-actions">
      <a href="../index.html" class="nav-link" title="回首頁">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        首頁
      </a>
      <a href="../Tools/index.html" class="nav-link" title="進入開發者工具箱">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        工具箱
      </a>
      <div class="badge-counter">
        已收錄 <span id="appCount">0</span> 款獨立應用
      </div>
    </div>
  </header>

  <!-- 英雄導引區 -->
  <section class="hero">
    <h1>Web 應用程式中心</h1>
  </section>

  <!-- 篩選與搜尋欄 -->
  <section class="controls-container">
    <div class="search-wrapper">
      <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋應用名稱、功能特色或標籤 (例如: 記帳, PWA, 離線, 備份)..."
        autocomplete="off" />
    </div>

    <!-- 分類按鈕 -->
    <div class="filter-tabs" id="categoryTabs">
      <button class="tab-btn active" data-category="all">全部應用</button>
      <button class="tab-btn" data-category="finance">個人理財</button>
      <button class="tab-btn" data-category="productivity">生產力工具</button>
      <button class="tab-btn" data-category="lifestyle">生活日常</button>
    </div>
  </section>

  <!-- 應用卡片展示網格 -->
  <main class="gallery-container">
    <div class="gallery-grid" id="galleryGrid">
      <!-- 卡片由 JS 動態渲染 -->
    </div>

    <!-- 查無結果空狀態 -->
    <div class="empty-state" id="emptyState">
      <svg class="empty-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <div class="empty-title">找不到符合條件的應用程式</div>
      <div class="empty-desc">請嘗試其他關鍵字，或切換到「全部應用」標籤。</div>
    </div>
  </main>

  <!-- 互動介紹與預覽 Modal 彈窗 -->
  <div class="modal-overlay" id="appModal" aria-hidden="true">
    <div class="modal-box modal-wide">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="modal-icon" id="modalIcon"></div>
          <div>
            <h2 class="modal-title" id="modalTitle">應用名稱</h2>
            <span class="status-badge status-ready" id="modalCategoryBadge">分類</span>
          </div>
        </div>
        <button class="modal-close-btn" id="modalCloseBtn" title="關閉">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- 動態應用介紹內容 -->
      <div class="modal-content-area" id="modalContent">
        <!-- 內容由 JS 依據應用 ID 動態生成 -->
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer class="footer">
    <p>© 2026 Jason's Workspace • 高效極簡獨立 Web 應用程式庫</p>
  </footer>

  <!-- JavaScript 邏輯 -->
  <script>
    // 應用程式資料庫
    const APPS = [
      {
        id: "expense-tracker",
        title: "記帳 App (Expense Tracker)",
        category: "finance",
        categoryName: "個人理財",
        desc: "本機優先（Local-First）極簡記帳 PWA。資料 100% 留存在本機 IndexedDB，零聯網更安全；支援快速記帳、本月消費分析、多類別管理與 JSON / CSV 匯出備份。",
        statusText: "即時可用",
        statusType: "popular",
        isAvailable: true,
        entryUrl: "ExpenseTracker/index.html",
        tags: ["PWA", "IndexedDB", "離線可用", "資料備份", "個人理財"],
        iconSvg: `
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        `,
        features: [
          {
            title: "本機優先 (Local-First)",
            desc: "全程資料儲存於瀏覽器內建 IndexedDB 資料庫，不連網、不發送任何資料到外部伺服器。"
          },
          {
            title: "PWA 離線與全螢幕",
            desc: "支援 iOS / Android『加入主畫面』，以原生 App 的無邊框全螢幕體驗離線記帳。"
          },
          {
            title: "完整備份與還原",
            desc: "一鍵匯出完整 JSON 檔案（供未來資料庫還原）或 CSV 報表（供 Excel / Numbers 統計分析）。"
          },
          {
            title: "彈性分類與即時統計",
            desc: "自訂 Emoji 分類，月度總支出快速切換檢視與消費歷史明細編輯。"
          }
        ]
      },
      {
        id: "pomodoro-timer",
        title: "Pomodoro 專注計時鐘",
        category: "productivity",
        categoryName: "生產力工具",
        desc: "番茄工作法專注計時器，內建沈浸式背景白噪音、自訂長短休息週期、以及每週專注時間分佈視覺化圖表。",
        statusText: "規劃推出",
        statusType: "planned",
        isAvailable: false,
        tags: ["番茄鐘", "專注力", "時間管理", "白噪音"],
        iconSvg: `
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        `,
        features: [
          {
            title: "番茄週期節奏",
            desc: "標準 25 分鐘專注 + 5 分鐘短休，支援自訂循環與長休間隔。"
          },
          {
            title: "音效與白噪音",
            desc: "內建雨聲、咖啡廳、柴火等高品質環境音效助於深度專注。"
          },
          {
            title: "本機時間統計",
            desc: "自動統計當日與當週專注番茄鐘數，掌握個人高效時間時段。"
          }
        ]
      },
      {
        id: "markdown-notes",
        title: "Markdown 靈感卡片盒",
        category: "productivity",
        categoryName: "生產力工具",
        desc: "基於 Zettelkasten 卡片盒思維的極簡筆記本。支援雙向連結、即時 Markdown 渲染與本機文字檔批次匯入匯出。",
        statusText: "規劃推出",
        statusType: "planned",
        isAvailable: false,
        tags: ["Markdown", "卡片盒", "知識管理", "離線筆記"],
        iconSvg: `
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        `,
        features: [
          {
            title: "即時預覽與編輯",
            desc: "邊寫邊看，支援 GFM 語法、程式碼高亮、待辦清單與公式。"
          },
          {
            title: "雙向卡片連結",
            desc: "使用 [[卡片名稱]] 輕鬆串聯不同想法與主題網絡。"
          },
          {
            title: "純文字不被綁架",
            desc: "單純的純文字與本機離線保存，隨時可匯出標準 .md 檔案。"
          }
        ]
      },
      {
        id: "habit-tracker",
        title: "微習慣養成打卡盒",
        category: "lifestyle",
        categoryName: "生活日常",
        desc: "專注於『原子習慣』微小改變的追蹤器。極簡熱力圖打卡、連續天數激勵與無干擾介面設計。",
        statusText: "規劃推出",
        statusType: "planned",
        isAvailable: false,
        tags: ["原子習慣", "打卡", "自律", "生活追蹤"],
        iconSvg: `
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        `,
        features: [
          {
            title: "點擊秒速打卡",
            desc: "專注核心習慣，無需繁瑣設定，每天打開點一下即可完成紀錄。"
          },
          {
            title: "GitHub 風格熱力圖",
            desc: "視覺化呈現一整年的堅持軌跡，感受累積帶來的成就感。"
          }
        ]
      }
    ];

    // 全域狀態
    let activeCategory = 'all';
    let searchQuery = '';

    // DOM 元素快取
    const galleryGrid = document.getElementById('galleryGrid');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const categoryTabs = document.getElementById('categoryTabs');
    const appCountBadge = document.getElementById('appCount');

    const appModal = document.getElementById('appModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalCategoryBadge = document.getElementById('modalCategoryBadge');
    const modalContent = document.getElementById('modalContent');

    // 取得狀態標籤 CSS 類別
    function getStatusBadgeClass(type) {
      switch (type) {
        case 'popular': return 'status-popular';
        case 'new': return 'status-new';
        case 'planned': return 'status-planned';
        default: return 'status-ready';
      }
    }

    // 渲染應用列表
    function renderGallery() {
      const filtered = APPS.filter(app => {
        const matchesCategory = activeCategory === 'all' || app.category === activeCategory;
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q ||
          app.title.toLowerCase().includes(q) ||
          app.desc.toLowerCase().includes(q) ||
          app.tags.some(tag => tag.toLowerCase().includes(q));
        return matchesCategory && matchesSearch;
      });

      appCountBadge.textContent = APPS.filter(a => a.isAvailable).length;

      if (filtered.length === 0) {
        galleryGrid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      galleryGrid.innerHTML = filtered.map(app => `
        <article class="app-card" onclick="openAppModal('${app.id}')" role="button" tabindex="0">
          <div>
            <div class="card-header">
              <div class="app-icon">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  ${app.iconSvg}
                </svg>
              </div>
              <span class="status-badge ${getStatusBadgeClass(app.statusType)}">
                ${app.statusText}
              </span>
            </div>
            <div class="card-body">
              <h3 class="app-title">${app.title}</h3>
              <p class="app-desc">${app.desc}</p>
            </div>
          </div>
          <div class="card-footer">
            <div class="app-tags">
              ${app.tags.map(tag => `<span class="tag-item">#${tag}</span>`).join('')}
            </div>
            <div class="card-action-bar">
              <span class="action-link">
                ${app.isAvailable ? '檢視介紹與預覽' : '檢視功能規劃'}
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
              </span>
            </div>
          </div>
        </article>
      `).join('');
    }

    // 開啟 App Modal 彈窗
    function openAppModal(appId) {
      const app = APPS.find(a => a.id === appId);
      if (!app) return;

      modalTitle.textContent = app.title;
      modalCategoryBadge.textContent = app.categoryName;
      modalIcon.innerHTML = `
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          ${app.iconSvg}
        </svg>
      `;

      let contentHtml = `
        <div>
          <p style="color: var(--gray-700); font-size: 14px; line-height: 1.6;">
            ${app.desc}
          </p>
        </div>
      `;

      if (app.features && app.features.length > 0) {
        contentHtml += `
          <div>
            <h4 style="font-size: 14px; font-weight: 600; color: var(--gray-900); margin-bottom: 0.5rem;">核心功能與特色</h4>
            <div class="feature-list">
              ${app.features.map(f => `
                <div class="feature-item">
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                  <div class="feature-text">
                    <strong>${f.title}</strong>
                    <p>${f.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (app.isAvailable && app.entryUrl) {
        contentHtml += `
          <div style="display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.25rem;">
            <a href="${app.entryUrl}" target="_blank" class="btn btn-primary">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
              在新分頁開啟全螢幕應用
            </a>
            <button class="btn btn-secondary" onclick="togglePreview()">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <span id="previewToggleText">展開即時互動預覽</span>
            </button>
          </div>

          <div id="previewContainer" class="preview-frame-container" style="display: none; margin-top: 0.5rem;">
            <iframe src="${app.entryUrl}" title="${app.title} 預覽"></iframe>
          </div>
        `;
      } else {
        contentHtml += `
          <div style="padding: 1rem; background: var(--color-beige-light); border: 1px dashed var(--border-color); border-radius: var(--radius-sm); text-align: center;">
            <p style="font-size: 13px; color: var(--gray-700);">
              🚀 該應用程式正在規劃開發中，敬請期待！
            </p>
          </div>
        `;
      }

      modalContent.innerHTML = contentHtml;
      appModal.classList.add('active');
      appModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    // 切換預覽框架顯示
    function togglePreview() {
      const container = document.getElementById('previewContainer');
      const text = document.getElementById('previewToggleText');
      if (!container) return;

      if (container.style.display === 'none') {
        container.style.display = 'block';
        if (text) text.textContent = '收合即時互動預覽';
      } else {
        container.style.display = 'none';
        if (text) text.textContent = '展開即時互動預覽';
      }
    }

    // 關閉 Modal
    function closeModal() {
      appModal.classList.remove('active');
      appModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      modalContent.innerHTML = '';
    }

    // 事件監聽綁定
    modalCloseBtn.addEventListener('click', closeModal);
    appModal.addEventListener('click', (e) => {
      if (e.target === appModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && appModal.classList.contains('active')) {
        closeModal();
      }
    });

    // 分類標籤點擊切換
    categoryTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      categoryTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.getAttribute('data-category');
      renderGallery();
    });

    // 搜尋輸入即時過濾
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGallery();
    });

    // 初始化頁面
    renderGallery();
  </script>
</body>

</html>
