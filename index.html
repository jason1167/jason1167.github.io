<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jason's Hub | 首頁入口</title>
  <meta name="description" content="Jason 的專屬工作入口網站與高效率線上實用工具庫。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    /* ==========================================================================
       UIUX Style 規範定義：
       1. 色彩系統：米色(#F5F5DC)、藍色(#006699)、灰色
       2. 風格：MUJI 簡約 + Microsoft Fluent + Claude + Linear 融合
       3. Typography：微軟正黑體, Inter, Noto Sans TC
          限定 7 種尺寸：32px, 24px, 20px, 18px, 16px, 14px, 12px
       4. Icon 尺寸：16px, 20px, 24px (Lucide 風格)
       ========================================================================== */

    :root {
      --color-beige-base: #F5F5DC;
      --color-beige-subtle: #fcfbfa;
      --color-beige-light: #f7f6f0;
      --color-beige-border: #e8e6dc;

      --primary: #006699;
      --primary-hover: #00527c;
      --primary-light: #e6f0f5;
      --primary-glow: rgba(0, 102, 153, 0.12);

      --gray-900: #1f2937;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-300: #d1d5db;
      --gray-200: #e5e7eb;
      --gray-100: #f3f4f6;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card-hover: 0 10px 20px -3px rgba(0, 102, 153, 0.08), 0 3px 6px -1px rgba(0, 0, 0, 0.03);

      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      background-color: var(--color-beige-subtle);
      color: var(--gray-900);
      min-height: 100vh;
      line-height: 1.6;
      font-size: 16px;
      /* 規範尺寸: 16 */
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 12% 12%, rgba(245, 245, 220, 0.6) 0%, transparent 40%),
        radial-gradient(circle at 88% 88%, rgba(0, 102, 153, 0.04) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* 頂部導航列 */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 2rem;
      border-bottom: 1px solid var(--color-beige-border);
      background-color: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--gray-900);
      font-weight: 700;
      font-size: 20px;
      /* 規範尺寸: 20 */
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px var(--primary-glow);
    }

    .brand-icon svg {
      width: 20px;
      /* 規範 Icon 尺寸: 20 */
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 14px;
      /* 規範尺寸: 14 */
      font-weight: 500;
      color: var(--primary);
      background: var(--color-beige-light);
      border: 1px solid var(--color-beige-border);
      text-decoration: none;
      transition: var(--transition);
    }

    .nav-btn-outline:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .nav-btn-outline svg {
      width: 16px;
      /* 規範 Icon 尺寸: 16 */
      height: 16px;
    }

    /* 主要內容區 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem 1.5rem;
      text-align: center;
    }

    /* 英雄標題區 */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.95rem;
      border-radius: var(--radius-full);
      background: var(--color-beige-light);
      border: 1px solid var(--color-beige-border);
      color: var(--gray-700);
      font-size: 14px;
      /* 規範尺寸: 14 */
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .hero-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    h1 {
      font-size: 32px;
      /* 規範尺寸: 32 */
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 1rem;
    }

    .hero-desc {
      font-size: 16px;
      /* 規範尺寸: 16 */
      color: var(--gray-500);
      max-width: 620px;
      margin: 0 auto 2.25rem auto;
      line-height: 1.6;
    }

    /* 核心 CTA 按鈕群組 */
    .cta-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3.5rem;
    }

    .btn-cta-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 2rem;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-size: 16px;
      /* 規範尺寸: 16 */
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .btn-cta-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 102, 153, 0.2);
    }

    .btn-cta-primary svg {
      width: 20px;
      /* 規範 Icon 尺寸: 20 */
      height: 20px;
      transition: transform 0.2s ease;
    }

    .btn-cta-primary:hover svg {
      transform: translateX(3px);
    }


    /* 頁尾 */
    .footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid var(--color-beige-border);
      background: #ffffff;
      font-size: 12px;
      /* 規範尺寸: 12 */
      color: var(--gray-500);
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 0.8rem 1.25rem;
      }

      .main-content {
        padding: 2.5rem 1.25rem;
      }

      h1 {
        font-size: 24px;
        /* 規範尺寸: 24 */
      }
    }
  </style>
</head>

<body>

  <!-- 頂部導航 -->
  <header class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <span>Jason's Tools</span>
    </a>
    <div class="nav-actions">
      <a href="Tools/index.html" class="nav-btn-outline">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
        進入工具箱
      </a>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="main-content">
    <h1>開發者工具庫</h1>
    <p class="hero-desc">
      整合字串多格式拆解 (String Magic)、雜湊與編碼轉換、JSON 格式化等必備線上工具，所有資料皆在本地端運算，安全有保障。
    </p>

    <!-- 核心入口連結按鈕 -->
    <div class="cta-container">
      <a href="Tools/index.html" class="btn-cta-primary" id="btnEnterTools">
        <span>開發者工具庫</span>
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </a>
    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="footer">
    <span>© Jason</span>
  </footer>

</body>

</html>
